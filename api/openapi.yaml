openapi: 3.1.0
info:
  title: Qoder Terminal Data API
  version: 0.1.0
servers:
  - url: http://localhost:8081
paths:
  /health:
    get:
      operationId: getHealth
      summary: Get health
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /v1/quotes/{symbol}:
    get:
      operationId: getQuote
      summary: Get quote
      parameters:
        - $ref: "#/components/parameters/Symbol"
      responses:
        "200":
          description: Latest quote
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Quote" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/history/{symbol}:
    get:
      operationId: getHistory
      summary: Get history
      parameters:
        - $ref: "#/components/parameters/Symbol"
        - $ref: "#/components/parameters/Range"
      responses:
        "200":
          description: Daily candlesticks
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Candle" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/news:
    get:
      operationId: listNews
      summary: List news
      parameters:
        - name: symbol
          in: query
          description: Required with the longbridge provider
          schema: { type: string, pattern: "^[0-9A-Z]{1,6}\\.(HK|US|SH|SZ)$" }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
      responses:
        "200":
          description: News items
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/NewsItem" }
        "400": { $ref: "#/components/responses/Error" }
  /v1/indicators/{symbol}:
    get:
      operationId: getIndicator
      summary: Get indicator
      parameters:
        - $ref: "#/components/parameters/Symbol"
        - name: kind
          in: query
          required: true
          schema: { type: string, enum: [sma, ema, rsi] }
        - name: window
          in: query
          required: true
          schema: { type: integer, minimum: 1, maximum: 250 }
        - $ref: "#/components/parameters/Range"
      responses:
        "200":
          description: Indicator series aligned with history; value is null until the window is filled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IndicatorSeries" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/quotes:
    get:
      operationId: listQuotes
      summary: Batch quotes
      description: One upstream call for a whole watchlist; symbols are comma-separated, at most 20
      parameters:
        - name: symbols
          in: query
          required: true
          schema: { type: string, example: "700.HK,9988.HK" }
      responses:
        "200":
          description: Quotes in the requested order
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Quote" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/watchlists:
    get:
      operationId: listWatchlists
      summary: List watchlist groups
      description: With the longbridge provider these are the account's watched groups; mock returns one demo group
      responses:
        "200":
          description: Watchlist groups
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Watchlist" }
  /v1/capital-flow/{symbol}:
    get:
      operationId: getCapitalFlow
      summary: Intraday capital flow
      parameters:
        - $ref: "#/components/parameters/Symbol"
      responses:
        "200":
          description: Per-minute net inflow and the large / medium / small order distribution
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CapitalFlow" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
components:
  parameters:
    Range:
      name: range
      in: query
      schema: { type: string, enum: ["1M", "3M", "6M", "1Y"], default: "3M" }
    Symbol:
      name: symbol
      in: path
      required: true
      schema: { type: string, pattern: "^[0-9A-Z]{1,6}\\.(HK|US|SH|SZ)$", example: "700.HK" }
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok] }
    Decimal:
      type: string
      pattern: "^-?\\d+(\\.\\d+)?$"
      description: Decimal number encoded as a string; floats are not allowed
    Quote:
      type: object
      required: [symbol, price, change, changePercent, currency, asOf]
      properties:
        symbol: { type: string }
        price: { $ref: "#/components/schemas/Decimal" }
        change: { $ref: "#/components/schemas/Decimal" }
        changePercent: { $ref: "#/components/schemas/Decimal" }
        currency: { type: string, enum: [HKD, USD, CNY] }
        asOf: { type: string, format: date-time }
    Candle:
      type: object
      required: [time, open, high, low, close, volume]
      properties:
        time:
          type: string
          format: date-time
          description: Trading day expressed as UTC midnight of that date (e.g. 2026-09-17T00:00:00Z is the Sep 17 daily candle)
        open: { $ref: "#/components/schemas/Decimal" }
        high: { $ref: "#/components/schemas/Decimal" }
        low: { $ref: "#/components/schemas/Decimal" }
        close: { $ref: "#/components/schemas/Decimal" }
        volume: { type: integer, format: int64 }
    NewsItem:
      type: object
      required: [id, headline, source, url, publishedAt]
      properties:
        id: { type: string }
        headline: { type: string }
        summary: { type: string }
        source: { type: string }
        url: { type: string, format: uri }
        symbols: { type: array, items: { type: string } }
        publishedAt: { type: string, format: date-time }
    IndicatorSeries:
      type: object
      required: [symbol, kind, window, points]
      properties:
        symbol: { type: string }
        kind: { type: string }
        window: { type: integer }
        points:
          type: array
          items:
            type: object
            required: [time, value]
            properties:
              time: { type: string, format: date-time }
              value:
                oneOf:
                  - $ref: "#/components/schemas/Decimal"
                  - type: "null"
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
    Watchlist:
      type: object
      required: [id, name, symbols]
      properties:
        id: { type: string }
        name: { type: string }
        symbols:
          type: array
          items:
            type: object
            required: [symbol, name]
            properties:
              symbol: { type: string }
              name: { type: string }
    CapitalBuckets:
      type: object
      required: [large, medium, small]
      properties:
        large: { $ref: "#/components/schemas/Decimal" }
        medium: { $ref: "#/components/schemas/Decimal" }
        small: { $ref: "#/components/schemas/Decimal" }
    CapitalFlow:
      type: object
      required: [symbol, currency, asOf, flow, distribution]
      properties:
        symbol: { type: string }
        currency: { type: string, enum: [HKD, USD, CNY] }
        asOf: { type: string, format: date-time }
        flow:
          type: array
          description: Net inflow per minute in ascending time order; negative means outflow
          items:
            type: object
            required: [time, inflow]
            properties:
              time: { type: string, format: date-time }
              inflow: { $ref: "#/components/schemas/Decimal" }
        distribution:
          type: object
          required: [in, out, net]
          properties:
            in: { $ref: "#/components/schemas/CapitalBuckets" }
            out: { $ref: "#/components/schemas/CapitalBuckets" }
            net:
              allOf:
                - $ref: "#/components/schemas/CapitalBuckets"
              description: in minus out per bucket, computed server side
